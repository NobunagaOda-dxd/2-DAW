<script>
    class Cuadrado {
        constructor(lado) {
            this.lado = lado
        }

        sumaDeLados() {
            return this.lado * 4
        }
        calcularArea() {
            return Math.pow(this.lado, 2);
        }
    }

    class Cubo extends Cuadrado {

        constructor(lado) {
            super(lado);

        }

        permitro() {
            return this.lado * 12
        }

        calcularArea() {
            return super.calcularArea() * 6
        }

        volumen() {
            return Math.pow(this.lado, 3)
        }
    }
    
</script>
