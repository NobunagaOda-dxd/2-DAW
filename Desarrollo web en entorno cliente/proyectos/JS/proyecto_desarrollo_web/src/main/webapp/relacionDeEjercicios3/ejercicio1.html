<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio-1</title>
</head>

<body>
    <div id="ventana">

    </div>
</body>
<script>
    let miFecha = new Date();
    let strMes = "";
    let strDia = "";
    let strcuatrimestre = "";

    switch (miFecha.getDay()) {
        case 0:
            strDia = "Lunes"
            break;

        case 1:
            strDia = "Martes"
            break;
        case 2:
            strDia = "Miercoles"
            break;
        case 3:
            strDia = "Jueves"
            break;
        case 4:
            strDia = "Viernes"
            break;
        case 5:
            strDia = "Sabado"
            break;
        case 6:
            strDia = "Domingo"
            break;
        default:
            console.log("dia no encontrado")
            break;
    }

    if (miFecha.getMonth() <= 3) {
        strcuatrimestre = "Primer trimestre"
    } else if(miFecha.getMonth() <= 7){
        strcuatrimestre = "Segundo trimestre"
    }else{
        strcuatrimestre = "Tercer trimestre"
    }

    switch (miFecha.getMonth()) {
        case 0:
            strMes = "Enero"
            break;

        case 1:
            strMes = "Febrero"
            break;
        case 2:
            strMes = "Marzo"
            break;
        case 3:
            strMes = "Abril"
            break;
        case 4:
            strMes = "Mayo"
            break;
        case 5:
            strMes = "Junio"
            break;
        case 6:
            strMes = "Julio"
            break;
        case 7:
            strMes = "Agosto"
            break;
        case 8:
            strMes = "Septiembre"
            break;
        case 9:
            strMes = "Octubre"
            break;
        case 10:
            strMes = "Noviembre"
            break;
        case 11:
            strMes = "Diciembre"
            break;
        default:
            console.log("mes no disponible")
            break;
    }

    document.getElementById("ventana").innerHTML = " Estamos en el día " + strDia + " del mes " + strMes + " del " +
    strcuatrimestre +  " del año " + miFecha.getFullYear()
    
    </script>
</html>
