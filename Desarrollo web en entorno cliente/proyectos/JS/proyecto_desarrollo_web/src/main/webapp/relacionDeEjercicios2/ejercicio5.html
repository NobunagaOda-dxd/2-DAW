<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ejercicio-5</title>
</head>

<body>
    <input type="number" id="num" placeholder="introduce los numeros del dni">
    <input type="button" value="comprobar la letra" onclick="comprobarLetra()">
    <div id="ventana">

    </div>
</body>
<script>
    function comprobarLetra() {
        let letras = ['T', 'R', 'W', 'A', 'G', 'M', 'Y', 'F', 'P', 'D', 'X', 'B', 'N', 'J', 'Z', 'S', 'Q', 'V', 'H', 'L', 'C', 'K', 'E', 'T'];
        let numero = parseInt(document.getElementById("num").value)
        let index = numero % 23
        let letra = letras[index]
        document.getElementById("ventana").innerHTML = "Tu letra es = " + letra
    }
</script>

</html>
