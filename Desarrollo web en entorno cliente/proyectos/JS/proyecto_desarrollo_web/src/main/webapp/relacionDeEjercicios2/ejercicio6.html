<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio-6</title>
</head>
<body>
    <input type="number" id="num" placeholder="introduce un numero">
    <input type="number" id="num2" placeholder="introduce un numero">
    <input type="number" id="num3" placeholder="introduce un numero">
    <input type="button" value="" onclick="encontrarElMenor()">

    <div id="ventana"></div>
</body>
    <script>
        function encontrarElMenor(){
            let num = parseInt(document.getElementById("num").value)
            let num2 = parseInt(document.getElementById("num2").value)
            let num3 = parseInt(document.getElementById("num3").value)

            let min = Math.min(num,num2,num3)
            document.getElementById("ventana").innerHTML = "El menor numero es = " + min 

        }
        
    </script>
</html>
