<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input type="button" value="abrir Ventana" onclick="abrirVentana()">
    <input type="button" value="cerrar Ventana" onclick="cerrarVentana()">
</body>
<script>
    let miVentana;
    function abrirVentana() {
        miVentana = window.open()
    }

    function cerrarVentana() {
        miVentana = window.close()
    }
</script>

</html>
