<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio-3</title>
</head>

<body>
    <h1>Clasificador de Triángulos</h1>
    <input type="number" id="lado1" placeholder="Introduce el primer lado">
    <input type="number" id="lado2" placeholder="Introduce el segundo lado">
    <input type="number" id="lado3" placeholder="Introduce el tercer lado">
    <input type="button" value="Analizar Triángulo" onclick="analizarTriangulo()">

    <script>
        function analizarTriangulo() {
            // 1. Capturar y convertir los datos a números
            let a = Number(document.getElementById("lado1").value);
            let b = Number(document.getElementById("lado2").value);
            let c = Number(document.getElementById("lado3").value);

            if (a + b > c && a + c > b && b + c > a) {

                if (a == b && b == c) {
                    alert("Es un TRIÁNGULO EQUILÁTERO");
                } else if (a != b && a != c && b != c) {
                    alert("Es un TRIÁNGULO ESCALENO");
                } else {
                    alert("Es un TRIÁNGULO ISÓSCELES");
                }

                if (a * a + b * b == c * c || b * b + c * c == a * a || a * a + c * c == b * b) {
                    alert("Y además es un TRIÁNGULO RECTÁNGULO");
                }

            } else {
                alert("NO ES UN TRIÁNGULO VÁLIDO");
            }
        }
    </script>
</body>

</html>
